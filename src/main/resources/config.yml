# Herobrine 2.0 - configuração
# A "presença" (0-100) de cada jogador sobe com o tempo jogado e com o que ele faz.
# O jogador nunca vê esse número. Quanto maior, mais intensos os eventos.

debug: false
disabled-worlds: [world_the_end]

# Skin do Herobrine (entidade Mannequin, exige Paper 1.21.9+).
# Deixe texture-value vazio para usar a skin da conta 'name'.
# Para olhos brancos, cole o value/signature de uma skin assinada (mineskin.org).
skin:
  name: "Herobrine"
  texture-value: ""
  texture-signature: ""

director:
  # Segundos entre decisões do diretor, por jogador.
  tick-seconds: 20
  # Chance base de algo acontecer a cada decisão (multiplicada pela presença).
  base-chance: 0.35
  # Segundos mínimos entre dois eventos para o mesmo jogador.
  event-cooldown-seconds: 90
  # Tempo sem eventos no primeiro login (minutos): dá um respiro no início.
  grace-minutes: 10

presence:
  # Pontos ganhos por minuto jogado.
  per-minute: 0.35
  # Perda por minuto sem jogar eventos (decaimento só offline/ao relogar).
  offline-decay-per-hour: 1.0
  # Pontos extras por comportamento
  mining-underground-per-100-blocks: 1.5
  night-indoors-per-minute: 0.5
  sleep: 2.0
  seen-bonus: 1.0

# Quais eventos podem acontecer (true/false) e peso base.
events:
  sounds:        { enabled: true, weight: 30 }
  footsteps:     { enabled: true, weight: 14 }
  fake-join:     { enabled: true, weight: 4 }
  animals-stare: { enabled: true, weight: 10 }
  extinguish:    { enabled: true, weight: 10 }
  doors:         { enabled: true, weight: 8 }
  sighting:      { enabled: true, weight: 22 }
  window:        { enabled: true, weight: 12 }
  strip-tree:    { enabled: true, weight: 8 }
  sign:          { enabled: true, weight: 6 }
  tunnel:        { enabled: true, weight: 8 }
  cross:         { enabled: true, weight: 4 }
  netherrack-fire: { enabled: true, weight: 4 }
  pyramid:       { enabled: true, weight: 3 }
  storm:         { enabled: true, weight: 4 }
  stalk:         { enabled: true, weight: 8 }
  chase:         { enabled: true, weight: 6 }
  hostile:       { enabled: false, weight: 2 }

# Máximo de blocos que as alterações de mundo mexem por tick.
world-edit:
  blocks-per-tick: 40

# Combate (só ocorre se events.hostile.enabled ou ao invocar pelo altar).
hostile:
  health: 200
  damage: 5.0
  duration-seconds: 45

altar:
  enabled: true
  # Base 3x3 de blocos de ouro, netherrack no centro, 4 tochas de redstone e fogo em cima.
  lightning: true

messages:
  fake-join: "§e{name} entrou no jogo"
  sign-lines:
    - ["ESTOU", "AQUI", "", ""]
    - ["ATRAS", "DE VOCE", "", ""]
    - ["VOCE", "NAO", "ESTA", "SOZINHO"]
    - ["PARE", "DE", "CAVAR", ""]
    - ["EU", "VI", "VOCE", "DORMIR"]
  scare-title: "§4§l"
  scare-subtitle: "§c"
