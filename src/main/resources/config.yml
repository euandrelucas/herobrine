# Herobrine 2.0 - configuração
# A "presença" (0-100) de cada jogador sobe com o tempo jogado e com o que ele faz.
# O jogador nunca vê esse número. Fases: 0 (<15) sons e recados | 1 (<35) avistamentos e mundo alterado
# | 2 (<55) estruturas, stalking | 3 (<75) perseguições | 4 (75+) encontros diretos e chefe.

debug: false
disabled-worlds: [world_the_end]

# Desative para tirar todos os sustos de tela (jumpscares).
jumpscares: true

# Estilo "Herobrine Always Spawns": false = ele já está no mundo (padrão).
# true = o mundo só é afetado depois que alguém o desperta com um Diamante Amaldiçoado no altar.
summon:
  required: false

# Skin do Herobrine (entidade Mannequin, exige Paper 1.21.9+).
# Deixe texture-value vazio para usar a skin da conta 'name'.
# Para olhos brancos, cole o value/signature de uma skin assinada (mineskin.org).
skin:
  name: "Herobrine"
  texture-value: ""
  texture-signature: ""

director:
  tick-seconds: 20          # segundos entre decisões, por jogador
  base-chance: 0.35         # chance base por decisão (multiplicada pela presença)
  event-cooldown-seconds: 90
  grace-minutes: 10         # respiro no começo da sessão

presence:
  per-minute: 0.35
  offline-decay-per-hour: 1.0
  mining-underground-per-100-blocks: 1.5
  night-indoors-per-minute: 0.5
  sleep: 2.0
  seen-bonus: 1.0

# Lista completa de eventos. enabled liga/desliga, weight é o peso base do sorteio.
events:
  sounds:           { enabled: true, weight: 30 }
  fake-chat:        { enabled: true, weight: 14 }
  redstone-under:   { enabled: true, weight: 6 }
  footsteps:        { enabled: true, weight: 14 }
  mossy-pyramid:    { enabled: true, weight: 4 }
  creeper-hiss:     { enabled: true, weight: 8 }
  animals-stare:    { enabled: true, weight: 10 }
  sighting:         { enabled: true, weight: 22 }
  bedrock-cross:    { enabled: true, weight: 4 }
  monument:         { enabled: true, weight: 4 }
  survivor-base:    { enabled: true, weight: 2 }
  extinguish:       { enabled: true, weight: 10 }
  doors:            { enabled: true, weight: 8 }
  title-who:        { enabled: true, weight: 5 }
  fake-logs:        { enabled: true, weight: 6 }
  chest-hi:         { enabled: true, weight: 3 }
  window:           { enabled: true, weight: 12 }
  strip-tree:       { enabled: true, weight: 8 }
  greet:            { enabled: true, weight: 4 }
  floating-bedrock: { enabled: true, weight: 3 }
  tunnel:           { enabled: true, weight: 8 }
  infect-animals:   { enabled: true, weight: 6 }
  fake-diamond:     { enabled: true, weight: 4 }
  flash:            { enabled: true, weight: 8 }
  ruined-shrine:    { enabled: true, weight: 2 }
  sign:             { enabled: true, weight: 6 }
  fake-join:        { enabled: true, weight: 4 }
  sky-stalker:      { enabled: true, weight: 5 }
  action-music:     { enabled: true, weight: 3 }
  trapped-house:    { enabled: true, weight: 2 }  # TNT sob placa de pressão: pode destruir parte do terreno
  storm:            { enabled: true, weight: 4 }
  weeping:          { enabled: true, weight: 6 }
  random-damage:    { enabled: true, weight: 3 }
  statue:           { enabled: true, weight: 3 }
  cross:            { enabled: true, weight: 4 }
  netherrack-fire:  { enabled: true, weight: 4 }
  cursed-forest:    { enabled: true, weight: 3 }
  stalk:            { enabled: true, weight: 8 }
  letters:          { enabled: true, weight: 2 }
  sand-pyramid:     { enabled: true, weight: 3 }
  title-hide:       { enabled: true, weight: 4 }
  fake-shutdown:    { enabled: true, weight: 3 }
  scream:           { enabled: true, weight: 4 }
  gl-errors:        { enabled: true, weight: 3 }
  circle:           { enabled: true, weight: 4 }
  chase:            { enabled: true, weight: 6 }
  knockback:        { enabled: true, weight: 4 }
  mage:             { enabled: true, weight: 3 }
  title-leave:      { enabled: true, weight: 3 }
  hostile:          { enabled: false, weight: 2 }   # Guerreiro/Caçador em combate (desligado por padrão)

world-edit:
  blocks-per-tick: 40

builder:
  enabled: true        # Herobrine visível construindo estruturas
  min-presence: 45

hostile:
  health: 200
  damage: 5.0
  duration-seconds: 45
  break-blocks: true   # quebra blocos para alcançar o jogador

mage:
  health: 60

boss:
  health: 300
  damage: 8.0
  tnt: false           # TNT na fase final (destrói blocos)

possessed-monsters:
  chance: 0.05
  health-multiplier: 1.5
  damage-multiplier: 1.3

altar:
  enabled: true
  lightning: true
  boss-min-presence: 0   # presença mínima para o fogo invocar o chefe

fake:
  kick-on-ignore: false  # expulsa quem ignora o falso "Herobrine joined the game"

messages:
  fake-join: "§e{name} entrou no jogo"
  fake-errors:
    - "§cUnable to remove entity 'Herobrine' (uuid not found)"
    - "§c[Server] Entity 303 is not a valid target"
    - "§cCannot unload chunk: Herobrine is still watching"
  fake-logs:
    - "§7[Render thread/WARN]: Missing sound for event: entity.herobrine.ambient"
    - "§7[Server thread/INFO]: Starting integrated server on port 25565 (local)"
    - "§7[Render thread/WARN]: Ignoring unknown entity 'herobrine:watcher'"
  sign-lines:
    - ["ESTOU", "AQUI", "", ""]
    - ["ATRAS", "DE VOCE", "", ""]
    - ["VOCE", "NAO", "ESTA", "SOZINHO"]
    - ["PARE", "DE", "CAVAR", ""]
    - ["EU", "VI", "VOCE", "DORMIR"]
    - ["SAIA", "", "", ""]
