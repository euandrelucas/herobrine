name: Herobrine
version: '${project.version}'
main: com.euandrelucas.herobrine.HerobrinePlugin
api-version: '1.21'
author: euandrelucas
description: Herobrine com presença oculta, aprendizado do jogador, estruturas e perseguições.

commands:
  herobrine:
    description: Comando principal do Herobrine.
    aliases: [hb]
    usage: /herobrine <spawn|banish|event|presence|reload|info>
    permission: herobrine.admin

permissions:
  herobrine.admin:
    description: Todos os comandos administrativos.
    default: op
  herobrine.altar:
    description: Invocar o Herobrine pelo altar.
    default: true
  herobrine.bypass:
    description: Jogador nunca é alvo do Herobrine.
    default: false
